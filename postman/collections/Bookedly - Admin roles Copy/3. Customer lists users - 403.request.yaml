$kind: http-request
name: 3. Customer lists users -> 403
url: "{{baseUrl}}/api/admin/users"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: pm.test("Status is 403 Forbidden", () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
