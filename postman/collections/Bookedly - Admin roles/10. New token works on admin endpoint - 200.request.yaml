$kind: http-request
name: 10. New token works on admin endpoint -> 200
url: "{{baseUrl}}/api/admin/users"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000
