$kind: http-request
name: Correct credentials -> 200
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Returns a token", () => pm.expect(body.token).to.be.a("string").and.not.empty);
      pm.test("Returns the right user", () => pm.expect(body.user.email).to.eql(pm.collectionVariables.get("email")));
      pm.collectionVariables.set("token", body.token);
    language: text/javascript
order: 1000
