$kind: http-request
name: Wrong password -> 401
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "wrong-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", () => pm.response.to.have.status(401));
      pm.collectionVariables.set("badLoginDetail", pm.response.json().detail);
    language: text/javascript
order: 2000
