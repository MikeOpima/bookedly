$kind: http-request
name: Same email again -> 409
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "fullName": "Mike Opima"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409 Conflict", () => pm.response.to.have.status(409));
      pm.test("Error is a problem detail", () => pm.expect(pm.response.json().status).to.eql(409));
    language: text/javascript
order: 2000
