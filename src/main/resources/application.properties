spring.application.name=bookedly

# --- Database (in-memory H2 for development; data is wiped on restart) ---
spring.datasource.url=jdbc:h2:mem:bookedly;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# Override in real environments with the JWT_SECRET environment variable (32+ characters).
bookedly.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
bookedly.jwt.ttl=1h
bookedly.jwt.issuer=bookedly
