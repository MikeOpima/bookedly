# Tests use a throwaway in-memory H2 database instead of the Docker Postgres,
# so they run without Docker. Each Spring test context gets its own database.
spring.datasource.url=jdbc:h2:mem:bookedly-test-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
